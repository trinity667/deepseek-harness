# render.yaml (blueprint)
services:
  - type: web
    name: deepseek-harness
    env: node
    region: oregon
    plan: standard
    buildCommand: |
      npm install -g pnpm@11.28.5 &&
      pnpm install --frozen-lockfile &&
      pnpm run build
    startCommand: node --import tsx/esm apps/cli/src/bin.ts web --no-open --host 127.0.0.1 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: DSH_HOST
        value: 127.0.0.1
