# DeepSeek Harness + FreeLLMAPI + Cloudflare Tunnel on one VM.
# Nothing listens on a public address: FreeLLMAPI and dsh bind loopback, and
# cloudflared dials out to Cloudflare, which enforces Cloudflare Access.
#
# Secrets are split per service so the agent's shell (inside `dsh`) never sees
# FreeLLMAPI's encryption key or admin password:
#   .env            compose interpolation only: COMPOSE_PROFILES (quick or named),
#                   DSH_PUBLIC_HOST, ADMIN_EMAIL, CLOUDFLARE_TUNNEL_TOKEN
#   freellmapi.env  ENCRYPTION_KEY, optional FREEAPI_CONFIG_JSON (first admin)
#   dsh.env         FREE_LLM_API_KEY (FreeLLMAPI's unified key)
#
# bootstrap.sh writes all three; by hand, copy the *.example files and fill them in.
#   docker compose -f deploy/oracle/compose.yml up -d

services:
  freellmapi:
    # Built from the tools/freellmapi subtree by .github/workflows/deploy-image.yml.
    image: ghcr.io/trinity667/freellmapi:latest
    env_file: freellmapi.env
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - freellmapi-data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  dsh:
    # Built for amd64 and arm64 by .github/workflows/deploy-image.yml.
    image: ghcr.io/trinity667/deepseek-harness:latest
    # Host network so dsh can bind 127.0.0.1 (it rejects wildcard binds) and
    # reach FreeLLMAPI at 127.0.0.1:3001.
    network_mode: host
    env_file: dsh.env
    command:
      - web
      - --patch
      - /config/freellmapi.patch.yml
      - --no-open
      - --public-url
      - https://${DSH_PUBLIC_HOST}/
      - --trusted-host
      - ${DSH_PUBLIC_HOST}
    volumes:
      - ./dsh/freellmapi.patch.yml:/config/freellmapi.patch.yml:ro
      - dsh-home:/data/dsh
      - dsh-workspace:/workspace
    depends_on:
      freellmapi:
        condition: service_healthy
    restart: unless-stopped

  # With your own domain (COMPOSE_PROFILES=named): a remote-managed tunnel whose
  # hostnames and Cloudflare Access policy live in the Zero Trust dashboard.
  cloudflared:
    profiles: [named]
    image: cloudflare/cloudflared:2026.10.6
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - dsh
    restart: unless-stopped

  # Without a domain (COMPOSE_PROFILES=quick): two protected Quick Tunnels on
  # random *.trycloudflare.com hosts; visitors must enter a one-time PIN sent
  # to ADMIN_EMAIL. The hosts change whenever these containers restart, so
  # bootstrap.sh starts them first and hands dsh the new host.
  quick-dsh:
    profiles: [quick]
    image: cloudflare/cloudflared:2026.10.6
    network_mode: host
    command: tunnel --no-autoupdate --url http://127.0.0.1:3080 --allowed-mail ${ADMIN_EMAIL}
    restart: unless-stopped

  quick-llm:
    profiles: [quick]
    image: cloudflare/cloudflared:2026.10.6
    network_mode: host
    command: tunnel --no-autoupdate --url http://127.0.0.1:3001 --allowed-mail ${ADMIN_EMAIL}
    restart: unless-stopped

volumes:
  freellmapi-data:
  dsh-home:
  dsh-workspace:
