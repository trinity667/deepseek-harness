#cloud-config
# DeepSeek Harness + FreeLLMAPI + Cloudflare Tunnel, installés tout seuls.
# À coller dans Oracle : Create instance → Advanced options → Management →
# « Paste cloud-init script ».
#
# ┌──────────────────────────────────────────────────────────────────────┐
# │  REMPLIS LES 3 VALEURS CI-DESSOUS (et rien d'autre)                  │
# │                                                                      │
# │  DOMAIN                  ton domaine Cloudflare, sans « https:// »   │
# │                          (le harness sera sur dsh.<domaine>,         │
# │                           FreeLLMAPI sur llm.<domaine>)              │
# │  ADMIN_EMAIL             ton e-mail (compte FreeLLMAPI)              │
# │  CLOUDFLARE_TUNNEL_TOKEN le jeton du tunnel Cloudflare (eyJ...)      │
# └──────────────────────────────────────────────────────────────────────┘
write_files:
  - path: /opt/dsh/settings.env
    permissions: '0600'
    owner: root:root
    content: |
      DOMAIN=mondomaine.com
      ADMIN_EMAIL=toi@example.com
      CLOUDFLARE_TUNNEL_TOKEN=COLLE_ICI_LE_JETON_DU_TUNNEL
      REF=master

# ── Rien à modifier en dessous ───────────────────────────────────────────

package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - openssl
  - curl

swap:
  filename: /swapfile
  size: 4G

runcmd:
  - systemctl enable --now docker
  - curl -fsSL https://raw.githubusercontent.com/trinity667/deepseek-harness/master/deploy/oracle/bootstrap.sh -o /opt/dsh/bootstrap.sh
  - chmod 755 /opt/dsh/bootstrap.sh
  - /opt/dsh/bootstrap.sh

final_message: "cloud-init terminé après $UPTIME secondes ; cherche le cadre « DeepSeek Harness est prêt » plus haut."
