#cloud-config
# DeepSeek Harness + FreeLLMAPI + Cloudflare, installés tout seuls.
# À coller dans Oracle : Create instance → Advanced options → Management →
# « Paste cloud-init script ».
#
# ┌──────────────────────────────────────────────────────────────────────┐
# │  REMPLIS TON E-MAIL CI-DESSOUS                                       │
# │                                                                      │
# │  ADMIN_EMAIL   ton e-mail : c'est la seule adresse qui pourra entrer │
# │                (code envoyé par e-mail) et le compte FreeLLMAPI      │
# │                                                                      │
# │  Sans nom de domaine : laisse DOMAIN et CLOUDFLARE_TUNNEL_TOKEN      │
# │  vides. Tu auras des adresses gratuites en *.trycloudflare.com,      │
# │  qui changent à chaque redémarrage du serveur.                       │
# │                                                                      │
# │  Avec ton domaine Cloudflare (plus tard) : DOMAIN=mondomaine.com et  │
# │  le jeton du tunnel (eyJ...) dans CLOUDFLARE_TUNNEL_TOKEN.           │
# └──────────────────────────────────────────────────────────────────────┘
write_files:
  - path: /opt/dsh/settings.env
    permissions: '0600'
    owner: root:root
    content: |
      ADMIN_EMAIL=toi@example.com
      DOMAIN=
      CLOUDFLARE_TUNNEL_TOKEN=
      REF=master

# ── Rien à modifier en dessous ───────────────────────────────────────────

package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - openssl
  - curl

swap:
  filename: /swapfile
  size: 4G

runcmd:
  - systemctl enable --now docker
  - curl -fsSL https://raw.githubusercontent.com/trinity667/deepseek-harness/master/deploy/oracle/bootstrap.sh -o /opt/dsh/bootstrap.sh
  - chmod 755 /opt/dsh/bootstrap.sh
  - /opt/dsh/bootstrap.sh

final_message: "cloud-init terminé après $UPTIME secondes ; cherche le cadre « DeepSeek Harness est prêt » plus haut."
